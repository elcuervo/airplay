name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Install dependencies
        run: nix develop -c bundle install
      - name: Run the default lane
        run: nix develop -c bundle exec rake
